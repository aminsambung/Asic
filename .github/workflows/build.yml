name: Build Dynamic Island APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # tombol manual di tab Actions

jobs:
  build:
    name: 🔨 Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Gradle (dengan cache)
      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # 4. Grant execute permission untuk gradlew
      - name: 🔑 Grant gradlew permission
        run: chmod +x ./gradlew

      # 5. Build Debug APK
      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Build Release APK (unsigned)
      - name: 📦 Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 7. Upload Debug APK
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 8. Upload Release APK
      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 9. Build info summary
      - name: 📊 Build Summary
        run: |
          echo "## 🎉 Build Sukses!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 APK Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download di tab **Actions** → pilih workflow run → scroll ke **Artifacts**" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/ || true
          ls -lh app/build/outputs/apk/release/ || true
